[package]
name = "jev-router"
version = "0.1.0"
edition = "2021"
description = "Jev-routed model + effort switching for Claude Code"

[dependencies]
libc = "0.2"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[profile.release]
lto = "thin"
strip = true
