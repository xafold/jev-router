<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jev-router</title>
<style>
:root {
  color-scheme: light;
  --page: #f5f4f1; --surface: #fcfcfb; --border: #e4e2dc; --grid: #ecebe7; --band: #efeeea;
  --text: #0b0b0b; --text-2: #52514e; --muted: #75746e;
  --haiku: #2a78d6; --sonnet: #eb6834; --opus: #1baf7a; --accent: #2a78d6; --baseline: #b4b2a9;
  --critical: #d03b3b; --good: #0a7d0a; --warning: #b77900; --focus: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #121211; --surface: #1a1a19; --border: #33332f; --grid: #2a2a27; --band: #262624;
    --text: #ffffff; --text-2: #c3c2b7; --muted: #95948c;
    --haiku: #3987e5; --sonnet: #d95926; --opus: #199e70; --accent: #3987e5; --baseline: #5f5e5a; --good: #3fbf3f; --critical: #e5534b; --warning: #e0a31a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #121211; --surface: #1a1a19; --border: #33332f; --grid: #2a2a27; --band: #262624;
  --text: #ffffff; --text-2: #c3c2b7; --muted: #95948c;
  --haiku: #3987e5; --sonnet: #d95926; --opus: #199e70; --accent: #3987e5; --baseline: #5f5e5a; --good: #3fbf3f; --critical: #e5534b; --warning: #e0a31a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: inherit; }
header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 20px; padding: 12px 24px; border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; }
.brand b { font-size: 16px; display: block; }
.brand span { color: var(--text-2); font-size: 12px; }
nav { display: flex; gap: 2px; background: var(--band); padding: 3px; border-radius: 10px; }
nav a { color: var(--text-2); text-decoration: none; padding: 5px 14px; border-radius: 8px; font-size: 13px; }
nav a[aria-current="page"] { color: var(--text); background: var(--surface); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.spacer { flex: 1; }
button, select, input { font: inherit; font-size: 14px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; }
button { cursor: pointer; }
button:hover { background: var(--band); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.filters { display: flex; gap: 10px; padding: 14px 24px 4px; flex-wrap: wrap; align-items: end; }
.filters label { color: var(--text-2); font-size: 12px; display: flex; flex-direction: column; gap: 3px; }
.filters .more { display: none; gap: 10px; flex-wrap: wrap; }
.filters.open .more { display: flex; }
main { padding: 12px 24px 48px; max-width: 1240px; margin: 0 auto; }
/* header and filters span the page but align their content to main's centered column */
header, .filters { padding-left: max(24px, calc((100% - 1240px) / 2 + 24px)); padding-right: max(24px, calc((100% - 1240px) / 2 + 24px)); }
main.loading { opacity: .6; }
.stack > * + * { margin-top: 16px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; min-width: 0; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.card > .legend { margin-bottom: 8px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); }
.kpis { display: grid; gap: 16px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi .l { color: var(--text-2); font-size: 12px; font-weight: 500; }
.kpi .v { font-size: 30px; font-weight: 650; line-height: 1.2; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .v.good { color: var(--good); }
.kpi .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
.donut { display: flex; align-items: center; justify-content: center; gap: 24px; flex-wrap: wrap; min-height: 200px; }
.donut .dl { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.donut .dl li { display: grid; grid-template-columns: 10px 90px 44px 28px; gap: 8px; align-items: center; }
.donut .dl b { text-align: right; }
.donut .dl .muted { text-align: right; font-size: 12px; }
svg text.donut-n { fill: var(--text); font-size: 26px; font-weight: 650; }
.hbar.rung { grid-template-columns: 120px 1fr 40px; font-size: 13px; margin: 9px 0; }
.hbar > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar.rung .num { text-align: right; }
.card h2 { font-size: 14px; margin: 0 0 10px; font-weight: 600; }
.card h3 { font-size: 14px; margin: 14px 0 6px; font-weight: 600; }
.lead { color: var(--text-2); margin: 0 0 14px; font-size: 14px; }
.hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
details { margin-top: 12px; }
summary { cursor: pointer; color: var(--text-2); font-size: 14px; }
summary:hover { color: var(--text); }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: grid; grid-template-columns: 104px minmax(0, 1fr) 72px 72px; gap: 14px; align-items: center; min-height: 46px; padding: 6px 12px; border-bottom: 1px solid var(--grid); cursor: pointer; border-radius: 8px; border-left: 3px solid var(--fam, var(--border)); margin: 2px 0; }
.list.compact li { grid-template-columns: 104px minmax(0, 1fr) 72px; }
.list li.day { display: block; border: 0; cursor: default; padding: 16px 4px 6px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.list li.day:hover { background: none; }
.list li.day:first-child { padding-top: 4px; }
.list li.head { cursor: default; border-left-color: transparent; min-height: 0; padding-top: 4px; padding-bottom: 8px; font-size: 12px; color: var(--muted); }
.list li.head:hover { background: none; }
.list li.head > :nth-child(3), .list li.head > :nth-child(4) { justify-self: end; }
.sort { border: 0; background: none; padding: 2px 4px; margin: 0 -4px; font-size: 12px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; justify-self: start; }
.sort:hover { background: var(--band); color: var(--text); }
.sort.on { color: var(--text); font-weight: 600; }
.sort i { font-style: normal; opacity: .7; }
.list .when { text-align: right; }
.mchip { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; }
.mchip i { font-style: normal; font-weight: 500; font-size: 11px; color: var(--text-2); background: var(--band); border-radius: 999px; padding: 1px 7px; }
.list li:last-child { border-bottom: 0; }
.list .cost { align-items: flex-end; font-size: 13px; display: flex; flex-direction: column; line-height: 1.3; }
.list .cost .saved { font-size: 11px; }
.list li:hover { background: var(--band); }
.list .when { color: var(--muted); font-size: 13px; white-space: nowrap; }
.list .msg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .why { color: var(--text-2); font-size: 13px; }
.list .right { text-align: right; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-weight: 600; font-size: 14px; }
.chip .eff { font-weight: 400; color: var(--text-2); }
.err { color: var(--critical); font-weight: 600; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.saved { color: var(--good); font-size: 13px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; color: var(--text-2); font-weight: 500; font-size: 12px; border-bottom: 1px solid var(--border); padding: 6px 8px; }
td { border-bottom: 1px solid var(--grid); padding: 8px; vertical-align: top; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.back { display: inline-block; margin: 4px 0 8px; color: var(--text-2); text-decoration: none; }
.title { font-size: 18px; font-weight: 650; margin: 0 0 2px; overflow-wrap: anywhere; }
.chip.big { font-size: 22px; gap: 8px; }
.chip.big .sw { width: 12px; height: 12px; }
.rate-tile { margin-top: 10px; }
.rate-tile .fb button { width: 38px; height: 38px; padding: 0; border-radius: 50%; font-size: 16px; }
.quote.clamp { display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; overflow: hidden; font-size: 13px; }
.fb { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.fb button[aria-pressed="true"] { border-color: var(--text); background: var(--band); font-weight: 600; }
.list.rate li { grid-template-columns: 60px minmax(0, 1fr) auto auto; cursor: default; }
.list.rate .when { text-align: left; }
.rate .msg { cursor: pointer; }
.rate .msg:hover { text-decoration: underline; }
.rate li.done { opacity: .55; }
.rate .fb { gap: 4px; flex-wrap: nowrap; }
.rate .fb button { width: 30px; height: 30px; padding: 0; border-radius: 50%; font-size: 14px; }
.fb button.rb-right[aria-pressed="true"] { border-color: var(--good); color: var(--good); }
.fb button.rb-too_low[aria-pressed="true"] { border-color: var(--critical); color: var(--critical); }
.fb button.rb-too_high[aria-pressed="true"] { border-color: var(--warning); color: var(--warning); }
.grid3 { display: grid; gap: 16px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid3 .hbar.rung { grid-template-columns: 96px 1fr 40px; }
.mixwrap { margin-bottom: 8px; }
.mix, .seg { display: flex; gap: 2px; border-radius: 4px; overflow: hidden; }
.mix { height: 10px; margin-bottom: 8px; }
.seg { height: 12px; }
.mix span, .seg span { display: block; min-width: 2px; }
.hbar.spend { grid-template-columns: 120px 1fr 56px; font-size: 13px; margin: 10px 0; }
.hbar.spend .num { text-align: right; }
.pair { display: grid; gap: 3px; }
.pair .b { height: 8px; }
.progress { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; margin-bottom: 14px; font-size: 13px; }
.knobs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.knob { background: var(--band); border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; font-size: 12px; color: var(--text-2); border: 1px solid transparent; }
.knob b { color: var(--text); font-size: 15px; }
.knob.on { border-color: var(--accent); }
.quote { border-left: 3px solid var(--accent); background: var(--band); padding: 10px 14px; border-radius: 0 8px 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.turn { border-left: 3px solid var(--border); padding: 4px 10px; margin: 6px 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
.turn span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.noul { display: grid; grid-template-columns: 130px 1fr 36px; gap: 10px; align-items: center; margin: 8px 0; font-size: 13px; }
.noul .num { text-align: right; }
.noul > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grid2.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.track { position: relative; height: 14px; background: var(--grid); border-radius: 4px; overflow: hidden; }
.track .unsure { position: absolute; top: 0; bottom: 0; background: var(--band); border-left: 1px dashed var(--muted); border-right: 1px dashed var(--muted); }
.track .fill { position: absolute; left: 0; top: 3px; bottom: 3px; background: var(--accent); border-radius: 0 4px 4px 0; }
.reasons { margin: 0; padding-left: 20px; }
.reasons li { margin: 4px 0; }
/* Decision figure: trees -> vote groups -> middle vote -> rules -> final (inverted org chart). */
.flow { overflow-x: auto; padding: 6px 2px 2px; }
.flow-in { display: flex; flex-direction: column; align-items: center; min-width: max-content; margin: 0 auto; }
.frow { display: flex; justify-content: center; }
.fcell { position: relative; display: flex; flex-direction: column; align-items: center; padding: 0 7px 20px; --ln: var(--border); }
.fcell.on { --ln: var(--accent); }
.fcell::before, .fcell::after { content: ""; position: absolute; bottom: 0; width: 50%; height: 20px; border-bottom: 2px solid var(--ln); }
.fcell::before { left: 0; }
.fcell::after { right: 0; border-left: 2px solid var(--ln); }
.fcell:first-child::before, .fcell:last-child::after { border-bottom: 0; }
.fcell:first-child:last-child::before { border: 0; }
.stem { width: 2px; height: 16px; background: var(--ln, var(--border)); }
.stem.on { background: var(--accent); }
.tcard { width: 168px; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; background: var(--surface); font-size: 12px; transition: opacity .15s; }
.tcard.off { opacity: .42; }
.tcard.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.tcard b { display: block; font-size: 13px; margin-bottom: 4px; text-transform: capitalize; }
.tq { display: flex; justify-content: space-between; gap: 6px; color: var(--text-2); line-height: 1.7; }
.tq .a { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tq .a.yes { color: var(--text); font-weight: 650; }
.tq .a.unsure { color: var(--text); font-weight: 650; text-decoration: underline dashed; text-underline-offset: 3px; }
.pill { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; font-size: 12px; background: var(--surface); white-space: nowrap; }
.pill.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; font-weight: 600; }
.pill .n { color: var(--muted); font-weight: 400; }
.mid { display: flex; align-items: center; gap: 4px; padding: 6px 12px; border: 1px solid var(--accent); border-radius: 10px; font-size: 12px; background: var(--surface); }
.mid .dot { width: 14px; height: 14px; border-radius: 4px; }
.mid .dot.m { outline: 2px solid var(--text); outline-offset: 2px; margin: 0 3px; }
.rail { font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 8px; border: 1px dashed var(--muted); border-radius: 8px; padding: 4px 10px; }
.final-box { color: #fff; border-radius: 12px; padding: 8px 20px; font-weight: 650; font-size: 15px; text-align: center; }
/* Equal-height cards in a row, so every connector line meets its card. */
.flow .fcell > .tcard { flex: 1; }
/* A pulse flows down the lit lines; steps appear top to bottom once per message. */
.flow .stem.on { background: linear-gradient(to bottom, var(--accent) 0 30%, color-mix(in srgb, var(--accent) 30%, #fff) 50%, var(--accent) 70% 100%); background-size: 100% 300%; animation: flow-down 1.4s linear infinite; }
@keyframes flow-down { from { background-position: 0 100%; } to { background-position: 0 0; } }
.flow-in.enter > * { animation: flow-step .4s ease-out both; animation-delay: calc(var(--i, 0) * 120ms); }
@keyframes flow-step { from { opacity: 0; transform: translateY(-6px); } }
/* Lit connectors under the cards: the borders become two thin gradient layers (down line,
   bar) so the pulse runs down from each card and along the bar toward the middle.
   .fr = left of the row's center (flows right), .fl = right of it (flows left). */
.flow { --pulse-v: linear-gradient(to bottom, var(--accent) 0 30%, color-mix(in srgb, var(--accent) 30%, #fff) 50%, var(--accent) 70% 100%);
        --pulse-h: linear-gradient(to right, var(--accent) 0 30%, color-mix(in srgb, var(--accent) 30%, #fff) 50%, var(--accent) 70% 100%); }
.flow .fcell.on::before, .flow .fcell.on::after { border-color: transparent; background-origin: border-box; background-repeat: no-repeat; }
.flow .fcell.on::before { background-image: var(--pulse-h); background-size: 300% 2px; background-position: 0 100%; animation: flow-h-r 1.4s linear infinite; }
.flow .fcell.on::after { background-image: var(--pulse-v), var(--pulse-h); background-size: 2px 300%, 300% 2px; background-position: 0 0, 0 100%; animation: flow-vh-l 1.4s linear infinite; }
.flow .fcell.on.fr::after { animation-name: flow-vh-r; }
.flow .fcell.on.fl::before { animation-name: flow-h-l; }
.flow .fcell.on:first-child::before { background: none; }
.flow .fcell.on:last-child::after { background-image: var(--pulse-v); background-size: 2px 300%; }
@keyframes flow-h-r { from { background-position: 100% 100%; } to { background-position: 0% 100%; } }
@keyframes flow-h-l { from { background-position: 0% 100%; } to { background-position: 100% 100%; } }
@keyframes flow-vh-r { from { background-position: 0 100%, 100% 100%; } to { background-position: 0 0, 0% 100%; } }
@keyframes flow-vh-l { from { background-position: 0 100%, 0% 100%; } to { background-position: 0 0, 100% 100%; } }
@media (prefers-reduced-motion: reduce) { .flow .stem.on, .flow-in.enter > *, .flow .fcell.on::before, .flow .fcell.on::after { animation: none; } }
.final-box span { display: block; font-weight: 400; font-size: 12px; opacity: .9; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--text-2); }
.kv dd { margin: 0; overflow-wrap: anywhere; min-width: 0; }
.hbar { display: grid; grid-template-columns: minmax(160px, 300px) 1fr 44px; gap: 10px; align-items: center; margin: 7px 0; font-size: 14px; }
.hbar .b { height: 12px; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px; }
.empty { padding: 40px 20px; text-align: center; color: var(--text-2); }
.tip { position: fixed; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.14); display: none; z-index: 10; max-width: 300px; }
.tip strong { display: block; font-size: 14px; }
.tip div { color: var(--text-2); }
.hist-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); margin-top: 10px; }
svg text { fill: var(--text-2); font-size: 11px; }
svg .grid-line { stroke: var(--grid); stroke-width: 1; }
svg .hit { fill: transparent; }
@media (max-width: 900px) { .grid2, .grid2.even, .grid3 { grid-template-columns: 1fr; } }
@media (max-width: 700px) {
  header, .filters { padding-left: 16px; padding-right: 16px; } main { padding: 12px 16px 40px; }
  .list li, .list.compact li { grid-template-columns: 90px minmax(0, 1fr); } .list .when, .list .cost { display: none; } .list.rate li { grid-template-columns: minmax(0, 1fr) auto; } .list.rate li .chip { display: none; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi .v { font-size: 24px; }
  .noul { grid-template-columns: 110px 1fr 36px; }
}
</style>
</head>
<body>
<header>
  <div class="brand"><b>jev-router</b></div>
  <nav aria-label="Pages">
    <a href="#/summary" data-view="summary">Summary</a>
    <a href="#/messages" data-view="messages">Messages</a>
    <a href="#/improve" data-view="improve">Improve</a>
  </nav>
  <span class="spacer"></span>
  <span class="muted" id="updated" style="font-size:13px"></span>
  <button id="refresh" type="button">Refresh</button>
  <button id="theme" type="button" aria-label="Color theme">Theme: system</button>
</header>
<div class="filters" id="filters">
  <label>Show<select id="f-range">
    <option value="all">All time</option><option value="1">Today</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option>
  </select></label>
  <label>Compare cost against<select id="f-baseline"></select></label>
  <label>Search messages<input id="f-search" type="search" placeholder="words in your message"></label>
  <button type="button" id="more-toggle" aria-expanded="false">More filters</button>
  <span class="more">
    <label>Project<select id="f-project"><option value="">All</option></select></label>
    <label>Model chosen<select id="f-rung"><option value="">All</option></select></label>
    <label>Source<select id="f-source"><option value="">All</option></select></label>
  </span>
</div>
<main id="view" aria-live="polite"></main>
<div class="tip" id="tip" role="tooltip"></div>
<script>
"use strict";
// Internally a "rung" is one of the 8 model + effort options (router.rs LADDER). The UI never
// says "rung": users see "model" and "effort".
const S = { decisions: [], usage: [], meta: null, feedback: {}, proxy: {}, tuning: null };
const $ = (id) => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";

// DOM builders. Record content (prompts, reasons, paths) is untrusted: text only, never HTML.
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style") el.style.cssText = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
function s(tag, attrs, ...kids) {
  const el = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) el.setAttribute(k, v);
  for (const kid of kids.flat(Infinity)) if (kid) el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return el;
}

// --- Plain-language vocabulary ----------------------------------------------------------
const FAMILIES = [
  { key: "haiku", label: "Haiku 4.5", color: "var(--haiku)" },

  concurrency: "It involves concurrency (threads, async, locks)",

  tests: "It asks for tests",

  asks_quality: "asks for care", asks_stronger_model: "asks for stronger model", compound: "several tasks", unfamiliar_domain: "specialist domain" };
const familyOf = (rung) => (rung || "").split(/[-/]/)[0];

function reasonSentence(w) {

  if ((m = w.match(/^trees disagree \(spread (\d+) rungs\): \+1 -> (.+)$/))) return `The trees disagreed a lot, so it picked one step stronger to be safe: ${friendly(m[2])}.`;
  if ((m = w.match(/^request type: (\w+) \(([\d.]+)\) -> start at (.+)$/))) return `Jev read it as ${INTENT_LABEL[m[1]] || m[1]} (confidence ${m[2]}), which starts at ${friendly(m[3])}.`;
  if ((m = w.match(/^needs clarification: cap -> (.+)$/)) && m[1] !== "haiku-4.5") return `Your message looked unclear and needs information only you have, so ${friendly(m[1])} asks first.`;
  if ((m = w.match(/^more effort: (.+) -> (.+)$/))) return `More effort because it ${m[1]}: ${friendly(m[2])}.`;
  if ((m = w.match(/^not clearly simple: no Haiku -> (.+)$/))) return `Haiku needs every signal to say "simple"; not all did, so ${friendly(m[1])}.`;
  if ((m = w.match(/^you asked for a model: -> (.+)$/))) return `You asked for ${friendly(m[1])}.`;
  if ((m = w.match(/^irreversible: floor -> (.+)$/))) return `It could destroy data or touch production, so at least ${friendly(m[1])}.`;
  if (w.startsWith("needs clarification")) return "Your message looked unclear, so the cheapest model asks clarifying questions first.";
  if ((m = w.match(/^security-sensitive: floor -> (.+)$/))) return `Security work always gets at least ${friendly(m[1])}.`;
  if ((m = w.match(/^concurrency: floor -> (.+)$/))) return `Concurrency work always gets at least ${friendly(m[1])}.`;
  if ((m = w.match(/^last answer \((.+)\) failed: floor -> (.+)$/))) return `The previous answer (from ${friendly(m[1])}) didn't work, so it moved to a stronger option: ${friendly(m[2])}.`;
  if ((m = w.match(/^~(\d+) context tokens: no downgrade \(cache rebuild\) -> (.+)$/))) return `The conversation is already long (~${fmt(m[1])} tokens). Switching to a cheaper model would throw away the prompt cache and cost more, so it stayed on ${friendly(m[2])}.`;

}
function shortReason(d) {
  if (!d.final) return "couldn't reach Jev; kept the previous model";
  const w = (d.why || []).slice(1).map((x) => x.split(":")[0]).pop() || "";
  if (w.startsWith("needs clarification")) return "unclear, so it asks first";
  if (w.startsWith("more effort")) return "more effort";
  if (w.startsWith("not clearly simple")) return "not clearly simple";
  if (w.startsWith("you asked")) return "you asked for this model";
  if (w.startsWith("asks for a stronger")) return "asked for a stronger model";
  if (w.startsWith("irreversible")) return "irreversible action rule";
  if (d.rules === "v2" && !w) return INTENT_LABEL[(d.intent || {}).choice] || "request type";
  if (w.startsWith("security")) return "security rule";
  if (w.startsWith("concurrency")) return "concurrency rule";
  if (w.startsWith("last answer")) return "previous answer failed";
  if (w.includes("context tokens")) return "long chat, kept the model";
  if (w.startsWith("trees disagree")) return "trees disagreed, one step stronger";

function priceFor(model) {

// Messages per day, stacked by model family. Last 14 days that have messages.

// Messages page sort: newest first by default. Day headings only make sense when sorted by time.

  const byTime = compact || msgSort.key === "time", clock = { hour: "numeric", minute: "2-digit" };

    };
    items.push(h("li", { class: "head" }, head("model", "Model"), h("span", { text: "Message" }), head("time", "Time"), head("cost", "Cost")));

const RAIL = [["unsure between", "unsure type, harder one"], ["reasoning depth", "deep reasoning"], ["specialist", "specialist domain"], ["more effort", "more effort"],
  ["asks for tests", "tests, more effort"], ["not clearly simple", "not clearly simple, no Haiku"], ["you asked", "you asked for it"], ["asks for a stronger", "asked for stronger"],
  ["irreversible", "irreversible rule"], ["needs clarification: cap -> sonnet", "unclear, Sonnet asks"], ["trees disagree", "trees disagree +1"], ["auto-tuning", "tuning nudge"], ["needs clarification", "unclear, Haiku asks"], ["security", "security rule"],
  ["concurrency", "concurrency rule"], ["last answer", "last answer failed"], ["context tokens", "long chat, no downgrade"]];
const FLOWQ = { ...QSHORT, perf: "scale needs", prior_failed: "failed before", open_ended: "system design", repeat_failure: "failed again",
  compound: "several tasks", asks_quality: "asks for care", unfamiliar_domain: "specialist", can_start: "can start", missing_user_info: "needs your info",
  asks_stronger_model: "asks stronger" };
const shortRung = (r) => `${fam(r).label}${effortOf(r) ? ` · ${effortOf(r)}` : ""}`;

// The notebook's forest figure: each tree's path, votes grouped by option, the middle vote,
// then any rule that moved it, then the final choice. Trees that voted for the middle are lit.
// Number the figure's steps for the staggered entry; play it only when a new message opens,
// not on the 30 s refresh.
let flowShown = null;
function animateFlow(fig, id) {
  const inner = fig.querySelector(".flow-in");
  // Which way each cell's bar segments flow: toward the middle of its row.
  for (const row of fig.querySelectorAll(".frow")) {
    const cells = [...row.children].filter((c) => c.classList.contains("fcell")), mid = (cells.length - 1) / 2;
    cells.forEach((c, i) => c.classList.add(i < mid ? "fr" : i > mid ? "fl" : "fc"));
  }
  [...inner.children].forEach((c, i) => c.style.setProperty("--i", i));
  if (flowShown !== id) inner.classList.add("enter");
  flowShown = id;
  return fig;
}

function decisionFlow(d) {
  if (d.rules === "v2") return animateFlow(decisionFlowV2(d), d.id);
  return animateFlow(decisionFlowV1(d), d.id);
}

function decisionFlowV1(d) {
  const order = (r) => S.meta.ladder.findIndex((l) => l.name === r);
  const trees = Object.entries(d.trees), median = d.median || (d.why[0] || "").split(": ")[1];
  const groups = [...new Set(trees.map(([, t]) => t.vote))].sort((a, b) => order(a) - order(b));
  const step = ({ key, noul, branch }) => {
    const unsure = branch.startsWith("unsure"), yes = branch.endsWith("yes");
    return h("div", { class: "tq", title: `${QLABEL[key] || key}: ${noul.toFixed(2)}` }, h("span", { text: FLOWQ[key] || key }),
      h("span", { class: `a${unsure ? " unsure" : yes ? " yes" : ""}`, text: `${noul.toFixed(2)} ${unsure ? "?" : yes ? "yes" : "no"}` }));
  };
  const group = (r) => {
    const mine = trees.filter(([, t]) => t.vote === r), on = r === median;
    return h("div", { class: `fcell${on ? " on" : ""}` },
      h("div", { class: "frow" }, mine.map(([name, t]) => h("div", { class: `fcell${on ? " on" : ""}` },
        h("div", { class: `tcard ${on ? "on" : "off"}` }, h("b", { text: name }), t.path.map(step))))),
      h("div", { class: `stem${on ? " on" : ""}` }),
      h("span", { class: `pill${on ? " on" : ""}` }, h("i", { class: "sw", style: `background:${fam(r).color}` }), shortRung(r), h("span", { class: "n", text: `${mine.length} vote${mine.length > 1 ? "s" : ""}` })));
  };
  const votes = trees.map(([, t]) => t.vote).sort((a, b) => order(a) - order(b)), mi = Math.floor(votes.length / 2);
  const rails = (d.why || []).slice(1).map((w) => {
    const label = (RAIL.find(([k]) => w.includes(k)) || [null, w])[1], to = [...w.matchAll(/-> ([a-z0-9.\-]+(?:\/[a-z]+)?)/g)].pop();
    return [h("div", { class: "stem on" }), h("div", { class: "rail", title: reasonSentence(w) }, h("span", { text: label }), to ? h("b", { text: `→ ${shortRung(to[1])}` }) : null)];
  });
  const rung = finalOf(d);
  return h("div", { class: "flow", role: "img", "aria-label": (d.why || []).map(reasonSentence).join(" ") },
    h("div", { class: "flow-in" },
      h("div", { class: "frow" }, groups.map(group)),
      h("div", { class: "stem on" }),
      h("div", { class: "mid", title: "Votes from cheapest to strongest; the middle one wins" }, votes.map((v, i) => h("i", { class: `dot${i === mi ? " m" : ""}`, title: friendly(v), style: `background:${fam(v).color}` })),
        h("span", { style: "margin-left:6px", text: "middle vote" })),
      rails,
      h("div", { class: "stem on" }),
      h("div", { class: "final-box", style: `background:${fam(rung).color}` }, fam(rung).label, h("span", { text: effortOf(rung) ? `${effortOf(rung)} effort` : "no effort setting" }))));
}

// v2: request type + reasoning depth + reading breadth -> starting option -> rules -> final.
// Same figure parts as the tree view: three lit cards, one stem, a pill, rule rails, the final.
function decisionFlowV2(d) {
  const st = d.jev.structured || {}, i = d.intent || {}, a = d.jev.answers || {}, th = S.meta.thresholds;
  const start = ((d.why[0] || "").match(/start at (\S+)$/) || [])[1];
  const level = (k) => { const x = (st[k] || {}).score; return Number.isFinite(x) ? `${x.toFixed(1)} of 3` : "–"; };
  const row = (label, v, cls, title) => h("div", { class: "tq", title: title || label }, h("span", { text: label }), h("span", { class: `a${cls ? ` ${cls}` : ""}`, text: v }));
  // Yes/no checks, same marks as the tree view: bold yes, dashed "?" when unsure.
  const check = (k) => {
    const p = a[k];
    if (!Number.isFinite(p)) return null;
    const cls = p > th.clear_yes ? "yes" : p >= th.clear_no ? "unsure" : "";
    return row(FLOWQ[k] || k, `${p.toFixed(2)} ${cls === "yes" ? "yes" : cls ? "?" : "no"}`, cls, QLABEL[k]);
  };
  const box = (title, rows, on) => h("div", { class: `fcell${on ? " on" : ""}` }, h("div", { class: `tcard ${on ? "on" : "off"}` }, h("b", { text: title }), rows));
  // A check card is lit when one of its checks fired (yes) or was unsure.
  const group = (title, keys, lit = (k, p) => p >= th.clear_no) => box(title, keys.map(check), keys.some((k) => Number.isFinite(a[k]) && lit(k, a[k])));
  const rails = (d.why || []).slice(1).map((w) => {
    const label = (RAIL.find(([k]) => w.startsWith(k)) || [null, w.split(":")[0]])[1], to = [...w.matchAll(/-> ([a-z0-9.\-]+(?:\/[a-z]+)?)/g)].pop();
    return [h("div", { class: "stem on" }), h("div", { class: "rail", title: reasonSentence(w) }, h("span", { text: label }), to ? h("b", { text: `→ ${shortRung(to[1])}` }) : null)];
  });
  const rung = finalOf(d);
  return h("div", { class: "flow", role: "img", "aria-label": (d.why || []).map(reasonSentence).join(" ") },
    h("div", { class: "flow-in" },
      h("div", { class: "frow" },
        box("Request type", [row(INTENT_LABEL[i.choice] || i.choice || "?", (i.confidence ?? 0).toFixed(2), "yes", "Jev's pick and its confidence"), row("runner-up", INTENT_LABEL[i.runner_up] || i.runner_up || "–")], true),
        box("Reasoning", [row("depth", level("depth"), "yes", "0 lookup · 1 straightforward · 2 multi-step · 3 trade-offs or subtle")], true),
        box("Reading", [row("breadth", level("breadth"), "yes", "0 none · 1 one file · 2 several files · 3 much of the repo")], true),
        group("Risk", ["security", "concurrency", "irreversible", "prior_failed", "repeat_failure"]),
        group("Effort cues", ["compound", "asks_quality", "tests", "perf", "unfamiliar_domain"]),
        group("Clarity", ["can_start", "missing_user_info", "asks_stronger_model"], (k, p) => (k === "can_start" ? p < th.clear_yes : p >= th.clear_no))),
      h("div", { class: "stem on" }),
      start ? h("span", { class: "pill on" }, h("i", { class: "sw", style: `background:${fam(start).color}` }), `starts at ${shortRung(start)}`) : null,
      rails,
      h("div", { class: "stem on" }),
      h("div", { class: "final-box", style: `background:${fam(rung).color}` }, fam(rung).label, h("span", { text: effortOf(rung) ? `${effortOf(rung)} effort` : "no effort setting" }))));
}

const INTENT_LABEL = { chat: "chat", general_knowledge: "general question", off_topic: "off-topic", lookup: "lookup", explain_code: "explain code",
  review_audit: "review / audit", plan_design: "plan / design", debug_fix: "debug / fix", implement: "implement", refactor_migrate: "refactor / migrate",

let rateShowAll = false;
function rateCard(ok) {

}

function knobs(t) {
  const same = (k) => JSON.stringify(t[k]) === JSON.stringify(S.tuning.default[k]);
  return [
    ["borderline", "Not sure", `${(0.5 - t.borderline).toFixed(2)}–${(0.5 + t.borderline).toFixed(2)}`],
    ["disagree_spread", "Step up if spread", `≥ ${t.disagree_spread}`],
    ["clarify_cap_below", "Ask first if clear", t.clarify_cap_below == null ? "off" : `< ${t.clarify_cap_below.toFixed(2)}`],
    ["offset", "Nudge", t.offset === 0 ? "0" : t.offset > 0 ? "+1" : "−1"],
  ].map(([k, name, value]) => ({ name, value, isDefault: same(k) }));
}

function tuningCard() {
  const t = S.tuning;
  if (!t) return null;
  const k = knobs(t.current), adjusted = k.some((x) => !x.isDefault), waiting = t.rated < t.min_ratings;
  const nextAt = Math.max(t.min_ratings, (t.rated_at_last_run ?? 0) + t.retune_every);
  const done = waiting ? t.rated / t.min_ratings : 1 - Math.max(0, nextAt - t.rated) / t.retune_every;
  return card("Auto-tuning", null,
    h("div", { class: "progress", title: waiting ? `Starts after ${t.min_ratings} ratings` : `Re-checks every ${t.retune_every} ratings` },
      h("div", { class: "track" }, h("span", { class: "fill", style: `width:${Math.min(1, done) * 100}%` })),
      h("span", { class: "num", text: waiting ? `${t.rated}/${t.min_ratings}` : `next in ${Math.max(0, nextAt - t.rated)}` })),
    h("div", { class: "knobs" }, k.map((x) => h("div", { class: `knob${x.isDefault ? "" : " on"}`, title: x.isDefault ? "default" : "adjusted from your ratings" }, h("span", { text: x.name }), h("b", { class: "num", text: x.value })))),
    t.history.length ? h("ul", { class: "reasons hint" }, [...t.history].reverse().slice(0, 3).map((r) => h("li", { title: r.reason }, `${ago(r.ts)}: ${r.changed ? "changed" : "no change"}`))) : null,
    adjusted ? h("p", {}, h("button", { type: "button", onclick: async () => { await fetch("/api/tuning/reset", { method: "POST" }); load(); }, text: "Reset to defaults" })) : null);
}

async function sendFeedback(id, label) {
  const r = await fetch("/api/feedback", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id, label }) });
  if (r.ok) {
    if (label === "clear") delete S.feedback[id]; else S.feedback[id] = label;
    S.tuning = await fetch("/api/tuning").then((x) => x.json()).catch(() => S.tuning);
    render();
  }
}

function pageMessage(id) {

  const text = words(latestOf(d));
  const head = h("div", {}, back, h("p", { class: "title", text: clip(text, 80), title: text }),
    h("div", { class: "muted", style: "font-size:13px", text: `${new Date(d.ts).toLocaleString()} · ${project(d.cwd)}` }));
  const asked = card("Prompt", null, h("div", { class: "quote clamp", text: latestOf(d) }),
    (state.history || []).length ? more(`${state.history.length} earlier turns`, state.history.map((t) => h("div", { class: "turn" }, h("span", { text: t.role }), t.text))) : null);
  if (!rung) return [head, card("Routing failed", "Jev couldn't be reached; the previous model was kept.", h("p", { class: "err", text: `⚠ ${d.error}` })), asked];

  const c = costs(usageByDecision().get(id) || [], $("f-baseline").value), u = d.jev.usage || {};

  const kpis = h("div", { class: "kpis" },
    tile("Model", h("span", { class: "chip big" }, h("i", { class: "sw", style: `background:${fam(rung).color}` }), fam(rung).label), effortOf(rung) ? `${effortOf(rung)} effort` : "no effort setting"),
    tile("Cost", c.priced ? money(c.actual) : "–", c.priced ? `${money(c.without)} on ${baselineName()}` : "no cost data"),

    h("div", { class: "card kpi" }, h("div", { class: "l", text: "Right model?" }), h("div", { class: "rate-tile" }, rateButtons(id, true))));

  // Jev's 9 answers, strongest yes first. Bar color = verdict; the shaded band is "not sure".
  const answers = Object.entries(d.jev.answers).sort((a, b) => b[1] - a[1]);
  const verdict = (p) => p > th.clear_yes ? ["yes", "var(--accent)"] : p < th.clear_no ? ["no", "var(--baseline)"] : ["unsure", "var(--warning)"];
  const jev = card("Jev answers", null,
    legend([{ color: "var(--accent)", label: "yes" }, { color: "var(--warning)", label: "unsure" }, { color: "var(--baseline)", label: "no" }]),
    answers.map(([k, p]) => { const [v, color] = verdict(p); return h("div", { class: "noul" }, h("span", { text: QSHORT[k] || k, title: QLABEL[k] || k }),
      tipTarget(h("div", { class: "track" }, h("span", { class: "unsure", style: `left:${th.clear_no * 100}%;width:${(th.clear_yes - th.clear_no) * 100}%` }), h("span", { class: "fill", style: `width:${Math.max(1, p * 100)}%;background:${color}` })), `${p.toFixed(2)} · ${v}`, QLABEL[k] || k),
      h("span", { class: "num", text: p.toFixed(2) })); }));

  const f = d.facts || {};
  const tech = card(null, null, more("Technical details", h("dl", { class: "kv", style: "margin-top:10px" },
    [["decision id", d.id], ["model id", `${d.final.model} (effort ${d.final.effort || "none"})`], ["previous model", f.previous_rung ? friendly(f.previous_rung) : "none (first message)"], ["conversation size", `~${fmt(f.context_tokens || 0)} tokens`],
     ["Jev", `${d.jev.model}, ${fmt(d.jev.latency_ms)} ms, ${fmt(u.input_tokens || 0)} tokens, request ${d.jev.request_id || "–"}`], ["session", d.session_id || "–"], ["source", d.source], ["folder", d.cwd]]
      .map(([k, v]) => [h("dt", { text: k }), h("dd", { text: String(v) })]))));
  return [head, kpis, h("div", { class: "grid2 even" }, asked, jev), card("How it decided", null, decisionFlow(d)), tech];
}

// A labelled horizontal bar row; value text stays in text ink, the bar carries the color.

const VERDICTS = [["right", "var(--good)", "✓ Right"], ["too_low", "var(--critical)", "↑ Too weak"], ["too_high", "var(--warning)", "↓ Could be cheaper"]];

function pageImprove() {
  const ok = filteredDecisions().filter(finalOf);
  if (!ok.length) return [empty("No messages match these filters.")];
  const th = S.meta.thresholds, n = ok.length, labelled = ok.filter((d) => S.feedback[d.id]);
  const count = (k) => labelled.filter((d) => S.feedback[d.id] === k).length;
  const tile = (label, value, sub, cls) => h("div", { class: "card kpi" }, h("div", { class: "l", text: label }), h("div", { class: `v${cls ? ` ${cls}` : ""}`, text: value }), sub ? h("div", { class: "s", text: sub }) : null);
  const kpis = h("div", { class: "kpis" },
    tile("Rated", `${fmt(labelled.length)}/${fmt(n)}`, `${pct(labelled.length, n)} of messages`),
    tile("Right", labelled.length ? pct(count("right"), labelled.length) : "–", `${fmt(count("right"))} ratings`, labelled.length ? "good" : null),
    tile("Too weak", fmt(count("too_low")), "needed a stronger model"),
    tile("Could be cheaper", fmt(count("too_high")), "a cheaper model would do"));

  const rungsRated = S.meta.ladder.map((r) => r.name).filter((r) => labelled.some((d) => finalOf(d) === r));
  const verdicts = card("Ratings by model", null,
    labelled.length ? [legend(VERDICTS.map(([, color, label]) => ({ color, label }))),
      rungsRated.map((r) => {
        const mine = labelled.filter((d) => finalOf(d) === r);
        return h("div", { class: "hbar rung" }, h("span", { text: shortRung(r) }),
          h("div", { class: "seg" }, VERDICTS.map(([k, color, label]) => { const c = mine.filter((d) => S.feedback[d.id] === k).length; return c ? tipTarget(h("span", { style: `flex:${c};background:${color}` }), `${c} × ${label}`, shortRung(r)) : null; })),
          h("span", { class: "num", text: fmt(mine.length) }));
      })] : h("p", { class: "muted", text: "No ratings yet." }));

  const unsure = S.meta.questions.map((q) => {
    const vs = ok.map((d) => d.jev.answers[q.key]).filter(Number.isFinite);
    return { q, share: vs.filter((v) => Math.abs(v - th.noul_yes) < th.borderline).length / Math.max(1, vs.length) };
  }).filter((r) => r.share > 0).sort((a, b) => b.share - a.share);
  const questions = card("Jev unsure", null,
    unsure.length ? unsure.map((r) => barRow(QSHORT[r.q.key] || r.q.key, r.share, pct(r.share, 1), r.share >= 0.3 ? "var(--warning)" : null,
      [QLABEL[r.q.key] || r.q.key, r.share >= 0.3 ? "Over 30%: reword it in router.rs (QUESTIONS)" : "answered 0.35–0.65"]))
      : h("p", { class: "muted", text: "Jev was sure on every question." }));

  const RULES = { "more effort": "More effort", "not clearly simple": "No Haiku", "unsure between": "Unsure type", "reasoning depth": "Deep reasoning", specialist: "Specialist", "you asked": "You asked", "asks for a stronger": "Asked stronger", "asks for tests": "Tests", irreversible: "Irreversible", "needs clarification": "Unclear, ask", "security-sensitive": "Security", concurrency: "Concurrency", "last answer": "Last failed", "trees disagree": "Disagree +1", "~": "Long chat" };
  const rule = (w) => { const k = Object.keys(RULES).find((p) => w.startsWith(p)); return k ? RULES[k] : w.split(":")[0]; };
  const fired = [...countBy(ok.flatMap((d) => (d.why || []).slice(1)), rule)].sort((a, b) => b[1] - a[1]);
  const rules = card("Rules fired", null,
    fired.length ? fired.map(([k, c]) => barRow(k, c / n, pct(c, n), null, [k, `${fmt(c)} of ${fmt(n)} messages`])) : h("p", { class: "muted", text: "No rule fired." }));

  // Only v1 records carry trees (v2 logs v1 as `shadow` without them).
  const withTrees = ok.filter((d) => d.trees);
  const treeRows = withTrees.length ? Object.keys(S.meta.forest).map((name) => {
    const usual = [...countBy(withTrees, (d) => d.trees[name].vote)].sort((a, b) => b[1] - a[1])[0][0];
    return { name, usual, share: withTrees.filter((d) => d.trees[name].vote === finalOf(d)).length / withTrees.length };
  }).sort((a, b) => b.share - a.share) : [];
  const trees = card("Tree agreement", null, legend(FAMILIES),
    treeRows.map((t) => barRow(t.name, t.share, pct(t.share, 1), fam(t.usual).color, [`${t.name}: matched the final choice`, `usually votes ${shortRung(t.usual)}`])));

  const recs = filteredUsage(), bp = $("f-baseline").value, byRung = new Map();
  for (const r of recs) { const k = r.kind === "manual" ? `manual:${r.model}` : r.rung; byRung.set(k, [...(byRung.get(k) || []), r]); }
  const order = (k) => { const i = S.meta.ladder.findIndex((l) => l.name === k); return i < 0 ? 99 : i; };
  const groups = [...byRung].sort((a, b) => order(a[0]) - order(b[0])).map(([k, rs]) => ({ k, rs, c: costs(rs, bp) }));
  const maxCost = Math.max(1e-9, ...groups.map((g) => Math.max(g.c.actual, g.c.without)));
  const spend = card("Cost by model", null,
    groups.length ? [legend([{ color: "var(--text-2)", label: "Actual (model color)" }, { color: "var(--baseline)", label: `On ${baselineName()}` }]),
      groups.map(({ k, rs, c }) => {
        const manual = k.startsWith("manual:"), label = manual ? `You: ${(priceFor(k.slice(7)) || {}).name || k.slice(7)}` : shortRung(k);
        const info = [`${fmt(rs.length)} requests · ${compact(c.tokens)} tokens`];
        return h("div", { class: "hbar spend" }, h("span", { text: label, title: label }),
          h("div", { class: "pair" },
            tipTarget(h("div", { class: "b", style: `width:${(c.actual / maxCost) * 100}%;background:${manual ? "var(--muted)" : fam(k).color}` }), money(c.actual), `${label}: actual`, ...info),
            tipTarget(h("div", { class: "b", style: `width:${(c.without / maxCost) * 100}%;background:var(--baseline)` }), money(c.without), `${label}: on ${baselineName()}`, ...info)),
          h("span", { class: "num", text: money(c.actual) }));
      })] : h("p", { class: "muted", text: "No cost data yet." }));

  return [kpis, h("div", { class: "grid2" }, rateCard(ok), verdicts), h("div", { class: "grid3" }, questions, rules, trees), h("div", { class: "grid2" }, spend, tuningCard())];
}

// --- Routing, filters, loading -------------------------------------------------------------
function render() {
  tip.style.display = "none";
  const [view, arg] = (location.hash.replace(/^#\//, "") || "summary").split("/");
  document.querySelectorAll("nav a").forEach((a) => a.setAttribute("aria-current", a.dataset.view === view || (view === "m" && a.dataset.view === "messages") ? "page" : "false"));
  $("filters").style.display = view === "m" ? "none" : "";
  if (!S.meta) return;
  const parts = view === "m" ? pageMessage(decodeURIComponent(arg || "")) : view === "messages" ? pageMessages() : view === "improve" ? pageImprove() : pageSummary();
  $("view").replaceChildren(h("div", { class: "stack" }, parts));
}

function fillSelect(id, values, labelOf = (v) => v, first = "All") {
  const sel = $(id), keep = sel.value;
  sel.replaceChildren(...(first ? [h("option", { value: "", text: first })] : []), ...values.map((v) => h("option", { value: v, text: labelOf(v), title: v })));
  if (values.includes(keep)) sel.value = keep;
}
const store = { get: (k, d) => { try { return localStorage.getItem(k) || d; } catch (_) { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) { /* storage blocked */ } } };

async function load() {
  $("view").classList.add("loading");
  try {
    const get = (p) => fetch(p).then((r) => { if (!r.ok) throw new Error(`${p}: ${r.status}`); return r.json(); });
    const [decisions, usage, meta, feedback, proxy, tuning] = await Promise.all(["/api/decisions", "/api/usage", "/api/meta", "/api/feedback", "/api/proxy", "/api/tuning"].map(get));
    const first = !S.meta;
    Object.assign(S, { decisions, usage, meta, feedback, proxy, tuning });
    fillSelect("f-source", [...new Set(decisions.map((d) => d.source))].sort());
    fillSelect("f-project", [...new Set(decisions.map((d) => d.cwd).filter(Boolean))].sort(), project);
    fillSelect("f-rung", meta.ladder.map((r) => r.name), friendly);
    if (first) {
      fillSelect("f-baseline", ["claude-opus-5-5", "claude-opus-5", "claude-sonnet-5", "claude-fable-5-1"], (k) => `${meta.pricing[k].name} for everything`, null);
      $("f-baseline").value = store.get("jev-baseline", "claude-opus-5-5");
    }
    $("updated").textContent = `Updated ${new Date().toLocaleTimeString()}`;
    render();
  } catch (e) {
    $("view").replaceChildren(empty(`Could not load data: ${e.message}. Is jev-router dashboard still running?`));
  } finally {
    $("view").classList.remove("loading");
  }
}

const THEMES = ["system", "light", "dark"];
let theme = store.get("jev-theme", "system");
const applyTheme = () => { if (theme === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", theme); $("theme").textContent = `Theme: ${theme}`; };
applyTheme();
$("theme").addEventListener("click", () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; applyTheme(); store.set("jev-theme", theme); });
$("more-toggle").addEventListener("click", (e) => { const open = $("filters").classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded", String(open)); e.currentTarget.textContent = open ? "Fewer filters" : "More filters"; });
for (const id of ["f-range", "f-source", "f-project", "f-rung"]) $(id).addEventListener("change", render);
$("f-baseline").addEventListener("change", () => { store.set("jev-baseline", $("f-baseline").value); render(); });
$("f-search").addEventListener("input", render);
$("refresh").addEventListener("click", load);
window.addEventListener("hashchange", () => { render(); scrollTo(0, 0); });
// Watch live sessions, but never re-render under an open "show more" or a focused control.
setInterval(() => { if (document.visibilityState === "visible" && !document.querySelector("details[open]") && !["INPUT", "SELECT"].includes((document.activeElement || {}).tagName)) load(); }, 30000);
load();
</script>
